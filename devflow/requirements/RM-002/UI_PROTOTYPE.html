    <!--

    Platform: WeChat Mini Program (Web Simulation)

    === Product Analysis ===
    Target Users: WeChat Mini Program用户 (C端用户，陪玩服务平台的消费者)
    Core Features:
      - Service list display with enhanced UI
      - Skeleton loading animation (3 placeholder cards)
      - Service card optimization (shadows, borders, rounded corners)
      - Image display with placeholder support
      - Pull-to-refresh interaction
      - Service card tap interaction
    Page Types: Single-page service list (index page)
    Critical Flows:
      1. Load services → Display skeleton → Show service list
      2. Pull-to-refresh → Reload services → Update list
      3. Tap service card → Show toast (detail page deferred to RM-XXX)

    === Design Inspirations ===

    **灵感来源1**: Dieter Rams (Industrial Design - Braun)
    **核心特质**: "少,但更好" (Weniger, aber besser) - 功能主义,无多余装饰,克制的色彩,精确的栅格系统
    **网页转译**:
      - 色彩: 中性灰度 (#F8F8F8, #E5E5E5, #333) + 克制的功能性强调色 (#07C160 WeChat绿)
      - 版式: 严格的8px栅格系统,左对齐文本,充足的留白,信息层级清晰
      - 形态: 圆角12rpx,微妙的阴影(0 2rpx 8rpx),功能驱动的按钮形态
      - 动效: 短促的过渡(150ms-200ms),功能性而非装饰性
    **禁止模仿**: 不复刻Braun经典产品(如T3收音机)的具体配色和按钮样式

    **灵感来源2**: Kengo Kuma (Architecture - 隈研吾)
    **核心特质**: 负建筑理念,微粒子化,自然纹理,光影的细腻处理,材料的温暖感
    **网页转译**:
      - 色彩: 温暖的米白 (#F8F8F8),木质灰 (#999),自然绿 (#07C160)
      - 版式: 模块化卡片(像建筑的单元),卡片间的呼吸间距(16rpx)
      - 形态: 微妙的纹理背景(skeleton的渐变动画模拟光影),卡片的层叠感(box-shadow)
      - 动效: 平滑的下拉刷新动画,卡片点击的微缩放效果(scale 0.98)
    **禁止模仿**: 不复刻具体建筑作品(如浅草文化观光中心)的立面纹理

    设计关键词: ["克制的灰度系统", "功能性强调色", "8px栅格", "温暖的留白", "微妙的光影"]

    === Design System ===
    Colors:
      Primary: #07C160 (WeChat绿 - 官方色)
      Text: #333 (primary), #666 (secondary), #999 (muted)
      Background: #F8F8F8 (page), #FFFFFF (card), #E5E5E5 (border)
      Status: #09BB07 (success/active), #E64340 (error)
      Skeleton: #F2F2F2, #E6E6E6 (gradient animation)

    Typography:
      Font Stack: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", sans-serif
      Font Sizes: 24rpx (xs), 28rpx (sm), 32rpx (base), 36rpx (lg), 40rpx (xl)
      Line Heights: 1.4 (tight), 1.6 (normal), 1.8 (relaxed)

    Spacing (8rpx grid):
      8rpx, 16rpx, 24rpx, 32rpx, 48rpx

    Border Radius: 12rpx (cards), 4rpx (tags)
    Shadows: 0 2rpx 8rpx rgba(0,0,0,0.1) (card), 0 4rpx 12rpx rgba(0,0,0,0.15) (active)
    Animations: 150ms ease (fast), 200ms ease (base)

    === Information Architecture ===
    Pages:
      / (index) - Service list page
        - Header: Title + Customer service link
        - Service list: 3 service cards
        - States: Loading (skeleton), Success (list), Error (retry), Empty

    Navigation: Single-page, no multi-page routing needed

    === Component Inventory ===
    Components:
      - Service Card (Organism):
        States: default, active (tap), skeleton (loading)
        Elements: image (200rpx x 150rpx), name, description, price, category, status
      - Skeleton Card (Molecule):
        Animated gradient background
      - Error State (Molecule):
        Message text + Retry button
      - Empty State (Atom):
        Empty message text

    Icons: No icon library needed (WeChat native components only)

    <style>
        /* === Design System (CSS Variables) === */
        :root {
            /* Colors (inspired by Dieter Rams minimalism + WeChat design) */
            --primary-color: #07C160;
            --primary-hover: #06A552;

            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --text-white: #FFFFFF;

            --bg-page: #F8F8F8;
            --bg-card: #FFFFFF;
            --bg-secondary: #F0F0F0;
            --bg-skeleton: #F2F2F2;
            --bg-skeleton-shine: #E6E6E6;

            --border-color: #E5E5E5;

            --status-active: #09BB07;
            --status-inactive: #999999;
            --status-error: #E64340;

            /* Typography (WeChat Mini Program standard) */
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", sans-serif;
            --font-size-xs: 12px;   /* 24rpx */
            --font-size-sm: 14px;   /* 28rpx */
            --font-size-base: 16px; /* 32rpx */
            --font-size-lg: 18px;   /* 36rpx */
            --font-size-xl: 20px;   /* 40rpx */

            --line-height-tight: 1.4;
            --line-height-normal: 1.6;
            --line-height-relaxed: 1.8;

            /* Spacing (8px grid - Dieter Rams precision) */
            --space-xs: 4px;    /* 8rpx */
            --space-sm: 8px;    /* 16rpx */
            --space-md: 12px;   /* 24rpx */
            --space-lg: 16px;   /* 32rpx */
            --space-xl: 24px;   /* 48rpx */

            /* Border Radius */
            --radius-sm: 2px;   /* 4rpx */
            --radius-md: 6px;   /* 12rpx */

            /* Shadows (Kengo Kuma subtle layering) */
            --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.1);
            --shadow-card-active: 0 2px 6px rgba(0, 0, 0, 0.15);

            /* Transitions (Dieter Rams functional, not decorative) */
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease;
        }

        /* === Reset & Base Styles === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            color: var(--text-primary);
            background-color: var(--bg-page);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* === Layout System === */
        .container {
            width: 100%;
            max-width: 375px; /* Mobile-first, WeChat standard width */
            margin: 0 auto;
            padding: var(--space-md);
            min-height: 100vh;
        }

        /* === Header Component === */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-lg);
            padding: var(--space-sm) 0;
        }

        .header-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .header-customer {
            padding: var(--space-xs) var(--space-md);
            background-color: var(--primary-color);
            color: var(--text-white);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: background-color var(--transition-fast);
            user-select: none;
        }

        .header-customer:hover {
            background-color: var(--primary-hover);
        }

        .header-customer:active {
            transform: scale(0.98);
        }

        /* === Service List === */
        .service-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md); /* Kengo Kuma breathing space */
        }

        /* === Service Card (Enhanced per PRD User Story 1) === */
        .service-item {
            display: flex;
            background-color: var(--bg-card);
            border-radius: var(--radius-md); /* PRD AC2: 8px圆角 → 12rpx */
            overflow: hidden;
            box-shadow: var(--shadow-card); /* PRD AC2: 浅灰色阴影 */
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            cursor: pointer;
            user-select: none;
        }

        /* PRD User Story 4: Card tap interaction */
        .service-item:active {
            transform: scale(0.98); /* PRD AC1: 点击反馈 */
            box-shadow: var(--shadow-card-active);
        }

        /* Service Image (PRD User Story 2) */
        .service-image {
            width: 100px; /* 200rpx */
            height: 75px; /* 150rpx */
            flex-shrink: 0;
            background-color: var(--bg-secondary);
            overflow: hidden;
        }

        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Service Info */
        .service-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: var(--space-sm); /* PRD AC2: 16px内边距 → 32rpx */
            justify-content: space-between;
            min-width: 0; /* Allow text truncation */
        }

        .service-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-xs);
            gap: var(--space-xs);
        }

        .service-name {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .service-category {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            padding: 2px var(--space-xs);
            background-color: var(--bg-secondary);
            border-radius: var(--radius-sm);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .service-description {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            line-height: var(--line-height-relaxed);
            margin-bottom: var(--space-sm);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .service-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-sm);
        }

        /* PRD AC3: Price format ¥XX.00/小时 */
        .service-price {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--status-error); /* PRD AC3: 红色高亮 */
        }

        .service-status {
            font-size: var(--font-size-xs);
            padding: 2px var(--space-sm);
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .status-active {
            background-color: rgba(9, 187, 7, 0.1);
            color: var(--status-active);
        }

        .status-inactive {
            background-color: rgba(128, 128, 128, 0.1);
            color: var(--status-inactive);
        }

        /* === Skeleton Loading (PRD User Story 1 AC4) === */
        .skeleton-item {
            display: flex;
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .skeleton-image {
            width: 100px;
            height: 75px;
            flex-shrink: 0;
            background: linear-gradient(90deg, var(--bg-skeleton) 25%, var(--bg-skeleton-shine) 50%, var(--bg-skeleton) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
        }

        .skeleton-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: var(--space-sm);
            gap: var(--space-xs);
        }

        .skeleton-title,
        .skeleton-desc,
        .skeleton-price {
            background: linear-gradient(90deg, var(--bg-skeleton) 25%, var(--bg-skeleton-shine) 50%, var(--bg-skeleton) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
            border-radius: var(--radius-sm);
        }

        .skeleton-title {
            width: 60%;
            height: 18px;
        }

        .skeleton-desc {
            width: 100%;
            height: 14px;
        }

        .skeleton-desc:nth-child(3) {
            width: 90%;
        }

        .skeleton-price {
            width: 30%;
            height: 18px;
            margin-top: auto;
        }

        /* Kengo Kuma inspired light animation */
        @keyframes skeleton-shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* === Error State === */
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl) 0;
            text-align: center;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: var(--space-lg);
            font-size: var(--font-size-base);
        }

        .retry-button {
            padding: var(--space-sm) var(--space-lg);
            background-color: var(--primary-color);
            color: var(--text-white);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: background-color var(--transition-fast);
        }

        .retry-button:hover {
            background-color: var(--primary-hover);
        }

        .retry-button:active {
            transform: scale(0.98);
        }

        /* === Empty State === */
        .empty-state {
            text-align: center;
            padding: var(--space-xl) 0;
            color: var(--text-secondary);
            font-size: var(--font-size-base);
        }

        /* === Pull-to-Refresh Indicator === */
        .pull-refresh-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            padding: var(--space-sm) var(--space-lg);
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            box-shadow: var(--shadow-card);
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            transition: transform var(--transition-base);
            z-index: 1000;
        }

        .pull-refresh-indicator.active {
            transform: translateX(-50%) translateY(0);
        }

        /* === Toast Notification === */
        .toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            padding: var(--space-md) var(--space-lg);
            background-color: rgba(0, 0, 0, 0.75);
            color: var(--text-white);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            transition: bottom var(--transition-base);
            z-index: 2000;
            white-space: nowrap;
        }

        .toast.show {
            bottom: var(--space-xl);
        }

        /* === Hidden State === */
        .hidden {
            display: none !important;
        }

        /* === Responsive Design === */
        @media (min-width: 376px) {
            .container {
                max-width: 414px; /* iPhone Plus / Max */
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 768px; /* Tablet */
            }

            .service-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-lg);
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 1024px; /* Desktop */
            }

            .service-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* === Accessibility === */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <script>
        /* === Mock Data (from PRD research materials) === */
        const MOCK_SERVICES = [
            {
                id: 'srv_001',
                name: '王者荣耀陪玩',
                description: '专业上分，稳定不坑，段位：王者50星，擅长打野和中单位置',
                price: 30.00,
                imageUrl: 'https://picsum.photos/seed/srv_001/300/200',
                category: '游戏陪玩',
                status: 'active'
            },
            {
                id: 'srv_002',
                name: '语音聊天陪伴',
                description: '温柔甜美，解压聊天，让你快乐每一天，支持唱歌和讲故事',
                price: 20.00,
                imageUrl: 'https://picsum.photos/seed/srv_002/300/200',
                category: '语音陪玩',
                status: 'active'
            },
            {
                id: 'srv_003',
                name: '吃鸡陪玩',
                description: '高胜率，枪法精准，带你轻松吃鸡，支持四排和双排模式',
                price: 35.00,
                imageUrl: 'https://picsum.photos/seed/srv_003/300/200',
                category: '游戏陪玩',
                status: 'active'
            }
        ];

        /* === State Management === */
        let currentState = 'loading'; // 'loading', 'success', 'error', 'empty'
        let services = [];
        let pullStartY = 0;
        let isPulling = false;

        /* === DOM Elements === */
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const serviceList = document.getElementById('service-list');
        const emptyState = document.getElementById('empty-state');
        const pullRefreshIndicator = document.getElementById('pull-refresh-indicator');
        const toast = document.getElementById('toast');
        const customerBtn = document.getElementById('customer-btn');
        const retryBtn = document.getElementById('retry-btn');

        /* === Service Rendering === */
        function renderServices(serviceData) {
            serviceList.innerHTML = '';

            if (serviceData.length === 0) {
                setState('empty');
                return;
            }

            serviceData.forEach(service => {
                const serviceCard = createServiceCard(service);
                serviceList.appendChild(serviceCard);
            });

            setState('success');
        }

        function createServiceCard(service) {
            const card = document.createElement('div');
            card.className = 'service-item';
            card.dataset.id = service.id;

            /* PRD User Story 2: Image display with Picsum placeholder */
            const image = document.createElement('div');
            image.className = 'service-image';
            const img = document.createElement('img');
            img.src = service.imageUrl;
            img.alt = service.name;
            img.loading = 'lazy'; // PRD AC5: lazy loading
            /* PRD AC3: Image error handling */
            img.onerror = function() {
                this.style.backgroundColor = '#E5E5E5';
                this.alt = '图片加载失败';
            };
            image.appendChild(img);

            const info = document.createElement('div');
            info.className = 'service-info';

            const header = document.createElement('div');
            header.className = 'service-header';

            const name = document.createElement('div');
            name.className = 'service-name';
            name.textContent = service.name;

            const category = document.createElement('div');
            category.className = 'service-category';
            category.textContent = service.category;

            header.appendChild(name);
            header.appendChild(category);

            const description = document.createElement('div');
            description.className = 'service-description';
            description.textContent = service.description;

            const footer = document.createElement('div');
            footer.className = 'service-footer';

            /* PRD AC3: Price format ¥XX.00/小时 */
            const price = document.createElement('div');
            price.className = 'service-price';
            price.textContent = `¥${service.price.toFixed(2)}/小时`;

            const status = document.createElement('div');
            status.className = `service-status ${service.status === 'active' ? 'status-active' : 'status-inactive'}`;
            status.textContent = service.status === 'active' ? '可预约' : '暂不可用';

            footer.appendChild(price);
            footer.appendChild(status);

            info.appendChild(header);
            info.appendChild(description);
            info.appendChild(footer);

            card.appendChild(image);
            card.appendChild(info);

            /* PRD User Story 4: Card tap interaction */
            card.addEventListener('click', () => handleServiceTap(service));

            return card;
        }

        /* === State Management === */
        function setState(state) {
            currentState = state;

            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            serviceList.classList.remove('hidden');
            emptyState.classList.add('hidden');

            switch (state) {
                case 'loading':
                    loadingState.classList.remove('hidden');
                    serviceList.classList.add('hidden');
                    break;
                case 'error':
                    errorState.classList.remove('hidden');
                    serviceList.classList.add('hidden');
                    break;
                case 'empty':
                    emptyState.classList.remove('hidden');
                    serviceList.classList.add('hidden');
                    break;
                case 'success':
                    // serviceList already visible
                    break;
            }
        }

        /* === Load Services (Simulated Mock API) === */
        function loadServices(delay = 1000) {
            setState('loading');

            // Simulate network request with delay
            setTimeout(() => {
                try {
                    // Simulate 10% error rate for demonstration
                    if (Math.random() < 0.1) {
                        throw new Error('Network error');
                    }

                    services = [...MOCK_SERVICES];
                    renderServices(services);
                } catch (error) {
                    console.error('Load services failed:', error);
                    setState('error');
                }
            }, delay);
        }

        /* === Event Handlers === */

        /* PRD User Story 4: Service card tap handler */
        function handleServiceTap(service) {
            console.log('点击了服务:', service.id);
            /* PRD AC3: Service detail page deferred to RM-XXX */
            showToast('服务详情开发中，敬请期待');
        }

        /* Customer service button */
        customerBtn.addEventListener('click', () => {
            showToast('客服功能已实现 (RM-003)');
        });

        /* Retry button */
        retryBtn.addEventListener('click', () => {
            loadServices();
        });

        /* === Pull-to-Refresh (PRD User Story 3) === */
        let touchStartY = 0;
        let touchCurrentY = 0;

        document.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                touchStartY = e.touches[0].clientY;
                isPulling = false;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (touchStartY === 0) return;

            touchCurrentY = e.touches[0].clientY;
            const pullDistance = touchCurrentY - touchStartY;

            /* PRD AC1: Show pull-refresh indicator */
            if (pullDistance > 50 && window.scrollY === 0) {
                isPulling = true;
                pullRefreshIndicator.classList.add('active');
                pullRefreshIndicator.textContent = '释放刷新';
            } else {
                pullRefreshIndicator.classList.remove('active');
                pullRefreshIndicator.textContent = '下拉刷新...';
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (isPulling) {
                /* PRD AC2: Trigger refresh */
                pullRefreshIndicator.textContent = '刷新中...';
                setTimeout(() => {
                    loadServices(100); // PRD AC2: Mock delay 100ms
                    pullRefreshIndicator.classList.remove('active');
                    isPulling = false;
                }, 300);
            }
            touchStartY = 0;
            isPulling = false;
        }, { passive: true });

        /* Simulated pull-refresh for desktop (click header to refresh) */
        document.querySelector('.header-title').addEventListener('click', () => {
            showToast('刷新中...');
            loadServices(100);
        });

        /* === Toast Notification === */
        function showToast(message, duration = 2000) {
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        /* === Initialization === */
        document.addEventListener('DOMContentLoaded', () => {
            console.log('UI Prototype initialized');
            console.log('Platform: WeChat Mini Program simulation');
            console.log('Design inspirations: Dieter Rams + Kengo Kuma');

            // Load services on page load
            loadServices();
        });
    </script>
